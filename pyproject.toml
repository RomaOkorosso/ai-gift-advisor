[project]
name = "ai-gift-advisor"
version = "0.1.0"
description = "AI-powered gift recommendation service"
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "alembic>=1.16,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "httpx>=0.28,<1.0",
]
